name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  solidus_admin:
    # Fork PRs must not execute tests on organization infrastructure.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/test_solidus.yml
    with:
      artifacts: true
      lib_name: admin
      coverage: true
    secrets: inherit

  solidus_api:
    # Fork PRs must not execute tests on organization infrastructure.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/test_solidus.yml
    with:
      lib_name: api
      coverage: true
    secrets: inherit

  solidus_backend:
    # Fork PRs must not execute tests on organization infrastructure.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/test_solidus.yml
    with:
      lib_name: backend
      coverage: true
    secrets: inherit

  solidus_backend_js:
    # Fork PRs must not execute tests on organization infrastructure.
    if: github.repository != 'zivotsbedou/solidus' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: solidus_backend JS
    runs-on: [self-hosted, Linux, ARM64, lima]
    env:
      LIB_NAME: backend
    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true
      - name: Run teaspoon tests
        run: |
          cd backend
          bundle exec teaspoon --require=spec/teaspoon_env.rb

  solidus_core:
    # Fork PRs must not execute tests on organization infrastructure.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/test_solidus.yml
    with:
      lib_name: core
      coverage: true
    secrets: inherit

  solidus_i18n:
    # Fork PRs must not execute tests on organization infrastructure.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/test_solidus.yml
    with:
      lib_name: i18n
    secrets: inherit

  solidus_sample:
    # Fork PRs must not execute tests on organization infrastructure.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/test_solidus.yml
    with:
      lib_name: sample
      coverage: false
    secrets: inherit

  solidus_legacy_promotions:
    # Fork PRs must not execute tests on organization infrastructure.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/test_solidus.yml
    with:
      lib_name: legacy_promotions
      coverage: true
    secrets: inherit

  solidus_promotions:
    # Fork PRs must not execute tests on organization infrastructure.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/test_solidus.yml
    with:
      lib_name: promotions
      coverage: true
    secrets: inherit
