name: Lint

on: [pull_request]

concurrency:
  group: lint-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

env:
  BUNDLE_ONLY: "lint"

jobs:
  ruby:
    # Fork PRs must not execute tests on organization infrastructure.
    if: github.repository != 'zivotsbedou/solidus' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Check Ruby
    runs-on: [self-hosted, Linux, ARM64, lima]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Lint Ruby files
        run: bin/rake lint:rb
      - name: Store test results
        uses: actions/upload-artifact@v7
        with:
          name: standardrb-results
          path: test-results

  erb:
    # Fork PRs must not execute tests on organization infrastructure.
    if: github.repository != 'zivotsbedou/solidus' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Check ERB
    runs-on: [self-hosted, Linux, ARM64, lima]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Lint ERB files
        run: bin/rake lint:erb

  javascript:
    # Fork PRs must not execute tests on organization infrastructure.
    if: github.repository != 'zivotsbedou/solidus' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Check JavaScript
    runs-on: [self-hosted, Linux, ARM64, lima]
    env:
      ESLINT_USE_FLAT_CONFIG: false
    steps:
      - uses: actions/checkout@v6
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install ESLint globally
        run: npm install --save-dev eslint@latest @eslint/js@latest @eslint/eslintrc@latest
      - name: Lint JS files
        run: bin/rake lint:js
